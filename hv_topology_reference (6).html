<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HV Power Supply Topology Reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf9f7;
    --bg2: #ffffff;
    --bg3: #f2f1ed;
    --bg4: #e6e5df;
    --border: rgba(0,0,0,0.08);
    --border2: rgba(0,0,0,0.12);
    --text: #1a1a18;
    --text2: #5c5c56;
    --text3: #9a9a92;
    --accent: #1a56db;
    --accent2: #1044b2;
    --accent-dim: rgba(26,86,219,0.08);
    --accent-dim2: rgba(26,86,219,0.04);
    --green: #0d7a4e;
    --green-dim: rgba(13,122,78,0.08);
    --amber: #92560a;
    --amber-dim: rgba(146,86,10,0.08);
    --red: #c0392b;
    --red-dim: rgba(192,57,43,0.08);
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
    --radius: 8px;
    --radius-lg: 12px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { overflow-x: hidden; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* ── Header ── */
  .header {
    border-bottom: 1px solid var(--border);
    padding: 28px 40px 24px;
    display: flex;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 20px;
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 50;
    width: 100%;
  }
  .header-label {
    font-family: var(--mono);
    font-size: 15px;
    letter-spacing: 0.15em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .header h1 {
    font-size: 24px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  .header-sub {
    font-size: 15px;
    color: var(--text2);
    margin-left: auto;
    text-align: right;
    line-height: 1.5;
  }

  /* ── Layout ── */
  .layout {
    display: grid;
    grid-template-columns: 220px 1fr;
    min-height: calc(100vh - 81px);
  }

  /* ── Sidebar ── */
  .sidebar {
    border-right: 1px solid var(--border);
    padding: 24px 0;
    position: sticky;
    top: 81px;
    height: calc(100vh - 81px);
    overflow-y: auto;
    min-width: 0;
  }
  .sidebar-section {
    padding: 0 16px 8px;
    font-family: var(--mono);
    font-size: 15px;
    letter-spacing: 0.12em;
    color: var(--text3);
    text-transform: uppercase;
  }
  .nav-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 9px 20px;
    background: none;
    border: none;
    cursor: pointer;
    font-family: var(--sans);
    font-size: 15px;
    color: var(--text2);
    transition: all 0.15s;
    border-left: 2px solid transparent;
    line-height: 1.4;
  }
  .nav-btn:hover { background: var(--bg3); color: var(--text); }
  .nav-btn.active {
    background: var(--accent-dim2);
    color: var(--accent);
    border-left-color: var(--accent);
    font-weight: 500;
  }
  .nav-btn .nb-id {
    font-family: var(--mono);
    font-size: 15px;
    color: var(--text3);
    display: block;
    margin-bottom: 1px;
  }
  .nav-btn.active .nb-id { color: var(--accent2); }

  /* ── Content ── */
  .content {
    padding: 32px 48px 60px;
    max-width: 860px;
    background: var(--bg);
    min-width: 0;
    overflow-x: hidden;
  }

  .topo-card { display: none; }
  .topo-card.active { display: block; }

  /* Card header */
  .card-header { margin-bottom: 28px; }
  .card-id {
    font-family: var(--mono);
    font-size: 15px;
    color: var(--accent);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .card-title {
    font-size: 28px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: -0.02em;
    margin-bottom: 6px;
    line-height: 1.2;
  }
  .card-subtitle {
    font-size: 16px;
    color: var(--text2);
    line-height: 1.6;
    margin-bottom: 16px;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    font-size: 15px;
    font-family: var(--mono);
    padding: 3px 10px;
    border-radius: 4px;
    border: 1px solid;
  }
  .tag-g { color: var(--green); border-color: rgba(13,122,78,0.22); background: var(--green-dim); }
  .tag-a { color: var(--amber); border-color: rgba(146,86,10,0.22); background: var(--amber-dim); }
  .tag-r { color: var(--red); border-color: rgba(192,57,43,0.22); background: var(--red-dim); }
  .tag-b { color: var(--accent); border-color: rgba(26,86,219,0.22); background: var(--accent-dim); }

  /* Divider */
  .divider {
    height: 1px;
    background: var(--border);
    margin: 28px 0;
  }

  /* Specs grid */
  .section-label {
    font-family: var(--mono);
    font-size: 15px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 14px;
  }
  .specs-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 28px;
  }
  .spec-cell {
    background: var(--bg2);
    padding: 12px 16px;
    min-width: 0;
    overflow-wrap: break-word;
  }
  .spec-k {
    font-family: var(--mono);
    font-size: 15px;
    color: var(--text3);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .spec-v {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
  }

  /* Explanation */
  .explanation { margin-bottom: 28px; }
  .explanation p {
    font-size: 16px;
    color: var(--text2);
    line-height: 1.85;
    margin-bottom: 14px;
  }
  .explanation p:last-child { margin-bottom: 0; }
  .explanation strong { color: var(--text); font-weight: 500; }

  /* Schematic placeholder */
  .schematic-block {
    border: 1px dashed var(--border2);
    border-radius: var(--radius-lg);
    background: var(--bg2);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 32px;
    margin-bottom: 28px;
    min-height: 200px;
    position: relative;
    overflow: hidden;
  }
  .schematic-block img {
    max-width: 100%;
    max-height: 300px;
    object-fit: contain;
    border-radius: 6px;
    display: none;
  }
  .schematic-block img.loaded { display: block; }

  /* Topology reference images */
  .topo-img {
    width: 100%;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .topo-img img {
    max-width: 100%;
    max-height: 420px;
    object-fit: contain;
    border-radius: 6px;
    display: block;
  }
  .topo-img figcaption {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text3);
    text-align: center;
    margin-top: 8px;
    padding: 0 8px;
    line-height: 1.4;
  }
  .schematic-block.has-imgs {
    flex-direction: column;
    align-items: stretch;
    min-height: auto;
    gap: 24px;
    padding: 24px;
  }

  /* Waveform analysis section */
  .wave-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-bottom: 20px; }
  .wave-table {
    width: 100%; border-collapse: collapse;
    margin-bottom: 0; font-size: 15px; min-width: 360px;
  }
  .wave-table th {
    text-align: left; padding: 8px 12px;
    background: var(--bg3); border-bottom: 1px solid var(--border2);
    font-family: var(--mono); font-size: 11px;
    color: var(--text3); letter-spacing: 0.06em; text-transform: uppercase;
  }
  .wave-table td {
    padding: 10px 12px; border-bottom: 1px solid var(--border);
    color: var(--text2); vertical-align: top; line-height: 1.6;
  }
  .wave-table td:first-child {
    font-family: var(--mono); font-size: 13px;
    color: var(--text); font-weight: 500; white-space: nowrap;
  }
  .wave-table tr:last-child td { border-bottom: none; }

  .eq-block {
    background: var(--bg3); border: 1px solid var(--border2);
    border-radius: var(--radius); padding: 16px 20px;
    font-family: var(--mono); font-size: 13px;
    color: var(--text); line-height: 2;
    margin: 14px 0; overflow-x: auto; white-space: pre;
  }
  .eq-block .eq-accent { color: var(--accent); font-weight: 500; }
  .eq-block .eq-green  { color: var(--green);  font-weight: 500; }
  .eq-block .eq-amber  { color: var(--amber);  font-weight: 500; }
  .eq-block .eq-dim    { color: var(--text3); }

  .analysis-insight {
    background: var(--accent-dim2); border: 1px solid rgba(26,86,219,0.15);
    border-radius: var(--radius); padding: 14px 18px; margin: 14px 0 28px;
  }
  .analysis-insight p { font-size: 15px; color: var(--text2); line-height: 1.7; }
  .analysis-insight strong { color: var(--text); font-weight: 500; }
  .placeholder-text {
    font-family: var(--mono);
    font-size: 15px;
    color: var(--text3);
    text-align: center;
  }
  .placeholder-icon {
    width: 48px;
    height: 48px;
    border: 1px dashed var(--border2);
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .add-img-btn {
    font-family: var(--mono);
    font-size: 15px;
    color: var(--accent);
    background: var(--accent-dim);
    border: 1px solid rgba(79,143,255,0.25);
    border-radius: 4px;
    padding: 6px 14px;
    cursor: pointer;
    transition: all 0.15s;
    margin-top: 4px;
  }
  .add-img-btn:hover { background: rgba(79,143,255,0.2); }
  .img-input { display: none; }

  /* Operating intervals */
  .intervals { margin-bottom: 28px; }
  .interval {
    border-left: 2px solid var(--bg4);
    padding: 0 0 20px 18px;
    position: relative;
  }
  .interval:last-child { padding-bottom: 0; }
  .interval::before {
    content: '';
    position: absolute;
    left: -5px;
    top: 6px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--bg4);
    border: 2px solid var(--bg3);
  }
  .interval.i0 { border-left-color: var(--accent); }
  .interval.i0::before { background: var(--accent); }
  .interval.i1 { border-left-color: var(--green); }
  .interval.i1::before { background: var(--green); }
  .interval.i2 { border-left-color: var(--amber); }
  .interval.i2::before { background: var(--amber); }
  .interval.i3 { border-left-color: var(--red); }
  .interval.i3::before { background: var(--red); }
  .interval-title {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 5px;
  }
  .interval-desc {
    font-size: 15px;
    color: var(--text2);
    line-height: 1.7;
  }

  /* Pros / Cons */
  .pros-cons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 28px;
  }
  .pros, .cons {
    border-radius: var(--radius);
    padding: 16px;
  }
  .pros { border: 1px solid rgba(13,122,78,0.18); background: rgba(13,122,78,0.05); }
  .cons { border: 1px solid rgba(192,57,43,0.18); background: rgba(192,57,43,0.05); }
  .pc-label {
    font-family: var(--mono);
    font-size: 15px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .pros .pc-label { color: var(--green); }
  .cons .pc-label { color: var(--red); }
  .pc-list { list-style: none; }
  .pc-list li {
    font-size: 15px;
    padding: 4px 0;
    line-height: 1.5;
    display: flex;
    gap: 8px;
  }
  .pros .pc-list li { color: #0a6040; }
  .cons .pc-list li { color: #a0311f; }
  .pc-list li::before { flex-shrink: 0; font-weight: 500; }
  .pros .pc-list li::before { content: '+'; color: var(--green); }
  .cons .pc-list li::before { content: '−'; color: var(--red); }

  /* Applications */
  .apps { display: flex; flex-wrap: wrap; gap: 6px; }
  .app-tag {
    font-size: 15px;
    font-family: var(--mono);
    padding: 4px 12px;
    border: 1px solid var(--border2);
    border-radius: 4px;
    color: var(--text2);
    background: var(--bg2);
  }

  /* References */
  .refs { display: flex; flex-direction: column; gap: 8px; }
  .ref {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 12px 14px; border: 1px solid var(--border);
    border-radius: var(--radius); background: var(--bg2);
    text-decoration: none; transition: border-color 0.15s, background 0.15s;
  }
  .ref:hover { border-color: var(--accent); background: var(--accent-dim); }
  .ref-num { font-family: var(--mono); font-size: 13px; color: var(--accent); font-weight: 500; min-width: 22px; padding-top: 1px; }
  .ref-body { flex: 1; }
  .ref-title { font-size: 15px; color: var(--text); font-weight: 500; line-height: 1.4; margin-bottom: 3px; }
  .ref-meta { font-size: 13px; color: var(--text3); font-family: var(--mono); }
  .ref-icon { font-size: 15px; color: var(--text3); padding-top: 2px; flex-shrink: 0; }
  .ref:hover .ref-icon { color: var(--accent); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 2px; }


  /* Market bar chart */
  .market-bars {
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: var(--r);
    padding: 16px 20px;
    margin: 10px 0 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bar-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .bar-label {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text2);
    min-width: 200px;
    flex-shrink: 0;
  }
  .bar-track {
    flex: 1;
    background: var(--bg3);
    border-radius: 4px;
    height: 20px;
    overflow: hidden;
  }
  .bar-fill {
    display: block;
    height: 100%;
    border-radius: 4px;
    background: var(--green);
    transition: width 0.6s ease;
  }
  .bar-fill.bar-b { background: var(--accent); }
  .bar-fill.bar-c { background: var(--amber); }
  .bar-fill.bar-d { background: var(--red); }
  .bar-fill.bar-e { background: var(--text3); }
  .bar-pct {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    min-width: 36px;
    text-align: right;
  }
  /* Animation */
  .topo-card.active { animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  /* Operating interval rows — circuit + waveform stacked left, text right */
  .op-interval-rows { margin-bottom: 28px; }
  .op-interval-row {
    display: grid;
    grid-template-columns: 270px 1fr;
    gap: 28px;
    align-items: start;
    padding: 24px 0;
    border-bottom: 1px solid var(--border);
  }
  .op-interval-row:last-child { border-bottom: none; }
  .op-interval-row .row-left {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .op-interval-row .row-img {
    border-radius: var(--radius);
    border: 1px solid var(--border2);
    background: var(--bg2);
    overflow: hidden;
  }
  .op-interval-row .row-img img { width: 100%; display: block; }
  .op-interval-row .row-wave {
    border-radius: var(--radius);
    border: 1px solid var(--border2);
    overflow: hidden;
  }
  .op-interval-row .row-wave img { width: 100%; display: block; }
  .op-interval-row .row-title {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 10px;
    line-height: 1.45;
  }
  .op-interval-row .row-desc {
    font-size: 15px;
    color: var(--text2);
    line-height: 1.82;
  }
  .op-interval-row .row-desc p { margin-bottom: 12px; }
  .op-interval-row .row-desc p:last-child { margin-bottom: 0; }
  .op-interval-row .row-title,
  .op-interval-row .row-desc { overflow-wrap: break-word; word-break: break-word; }
  @media (max-width: 960px) {
    .op-interval-row { grid-template-columns: 200px 1fr; gap: 18px; }
  }
  @media (max-width: 700px) {
    .op-interval-row { grid-template-columns: 120px 1fr; gap: 12px; padding: 16px 0; }
    .op-interval-row .row-title { font-size: 13px; }
    .op-interval-row .row-desc { font-size: 13px; line-height: 1.65; }
  }

  /* Score comparison table */
  .score-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-bottom: 20px; }
  .score-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 0; min-width: 480px; }
  .score-table th {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text3);
    padding: 6px 8px;
    text-align: center;
    border-bottom: 1px solid var(--border2);
    white-space: nowrap;
  }
  .score-table th:first-child { text-align: left; }
  .score-table td { padding: 5px 8px; text-align: center; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--text2); }
  .score-table td:first-child { text-align: left; font-weight: 500; color: var(--text); white-space: nowrap; }
  .score-table tr:last-child td { border-bottom: none; }
  .score-table .score-td-total { font-weight: 600; color: var(--text); }

  /* Responsive — tablet */
  @media (max-width: 960px) {
    .layout { grid-template-columns: 190px 1fr; }
    .content { padding: 24px 28px 48px; max-width: 100%; }
    .specs-grid { grid-template-columns: repeat(2, 1fr); }
    .header { padding: 20px 28px 18px; }
  }

  /* Responsive — mobile */
  @media (max-width: 700px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { position: static; height: auto; display: flex; flex-wrap: wrap; padding: 12px; gap: 4px; border-right: none; border-bottom: 1px solid var(--border); top: 0; }
    .sidebar-section { display: none; }
    .nav-btn { width: auto; padding: 6px 10px; border-left: none; border-radius: 4px; font-size: 13px; }
    .nav-btn .nb-id { display: none; }
    .nav-btn.active { border-left: none; border-radius: 4px; }
    .content { padding: 16px 16px 40px; max-width: 100%; }
    .card-title { font-size: 22px; }
    .card-subtitle { font-size: 14px; }
    .specs-grid { grid-template-columns: 1fr 1fr; }
    .pros-cons { grid-template-columns: 1fr; }
    .header { flex-direction: column; align-items: flex-start; gap: 6px; padding: 16px; }
    .header-sub { margin-left: 0; text-align: left; font-size: 13px; }
    .header h1 { font-size: 20px; }
    .divider { margin: 18px 0; }
    .schematic-block { padding: 16px; }
    .ref { flex-wrap: wrap; gap: 8px; }
  }
</style>
</head>
<body>

<header class="header">
  <div>
    <div class="header-label">Power Electronics Reference</div>
    <h1>HV Power Supply Topologies</h1>
  </div>
  <div class="header-sub">10 isolated &amp; non-isolated topologies<br>Click a topology to read the full explanation</div>
</header>

<div class="layout">
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-section">Topologies</div>
  </nav>
  <main class="content" id="content"></main>
</div>

<script>
const topos = [
  {
    id:"LLC+LLC_DCX", name:"LLC + LLC DCX",
    sub:"Two-stage all-resonant cascade — a frequency-regulated LLC feeds a fixed-frequency LLC DC transformer, squeezing ZVS and ZCS out of every switch in the chain for peak unidirectional efficiency.",
    tags:[{l:"All-resonant two stages",c:"g"},{l:"ZVS + ZCS everywhere",c:"g"},{l:"Galvanic isolation",c:"b"},{l:"Unidirectional",c:"a"},{l:"Open-loop DCX stage",c:"b"}],
    specs:[{k:"Stage 1",v:"LLC — frequency regulation"},{k:"Stage 2",v:"LLC in DCX mode (open-loop)"},{k:"DCX gain",v:"Fixed = n (turns ratio)"},{k:"Stage 1 control",v:"Switching frequency fs"},{k:"Peak efficiency",v:"97 – 99.5%"},{k:"Isolation",v:"Both stages isolated"}],
    how:[
      "The fundamental motivation: a single LLC converter achieves extraordinary efficiency only at its resonant operating point — one fixed frequency, one fixed voltage ratio. Varying the frequency to regulate a wide input range forces the tank away from resonance, increasing reactive current and reducing efficiency. Cascading two LLC stages solves this by assigning <strong>regulation</strong> to Stage 1 and <strong>ultra-efficient fixed-ratio conversion</strong> to Stage 2, so that Stage 2 never leaves its resonant sweet spot.",
      "<strong>Stage 1 — LLC as voltage regulator:</strong> The first LLC converter accepts a variable input (e.g. from a PFC stage or a battery with a wide state-of-charge swing) and regulates the intermediate DC bus through frequency modulation. As input voltage rises, fs increases (tank moves inductive, gain falls); as input drops, fs decreases (gain rises). The control target is to hold the intermediate bus at exactly <strong>n₂ × Vout</strong> — the precise value Stage 2 requires to operate at series resonance. Stage 1 still benefits from ZVS on its primary switches and near-ZCS on secondary diodes, so its efficiency remains high (~97%) even while regulating.",
      "<strong>Stage 2 — LLC in DCX mode:</strong> With the intermediate bus held constant by Stage 1, the second LLC stage is locked at its series resonant frequency <strong>fr1 = 1/(2π√(Lr₂·Cr₂))</strong> with 50% duty cycle and no frequency modulation. The magnetizing inductance Lm is clamped by the reflected output and does not participate — only Lr₂ and Cr₂ resonate. Voltage gain equals exactly the turns ratio n₂. ZVS on primary MOSFETs is perfect because the inductor current is always sufficiently negative at turn-on; ZCS on secondary diodes is guaranteed because the sinusoidal resonant current reaches zero naturally before every commutation. There is no switching loss in Stage 2. Efficiency routinely exceeds 99% at this fixed operating point.",
      "<strong>System efficiency and intermediate bus decoupling:</strong> an intermediate film capacitor bank decouples the two stages. Stage 1 sees all input transients, battery voltage sag, and load steps — Stage 2 sees only a clean, stable DC rail. Total system efficiency = η_LLC1 × η_LLC2 ≈ 0.97 × 0.995 ≈ 96.5% in the worst case, but because Stage 1's frequency variation is small when the input range is moderate (e.g. ±15% around nominal), it operates closer to its own resonant point most of the time — pushing real-world cascade efficiency above 98%. Unlike the DAB+LLC hybrid, this architecture uses resonant switching throughout — no hard-switching bridge at any operating point.",
      "The LLC+LLC_DCX architecture is <strong>inherently unidirectional</strong>: standard LLC secondary diodes cannot reverse power flow without becoming synchronous rectifiers with a separate reverse-power mode, which adds complexity and control challenges. For applications where bidirectionality is not needed — server PSUs, LED drivers, one-way EV charger stages, solar DC-DC — this cascade delivers the highest possible efficiency with the simplest Stage 2 control (open-loop fixed frequency)."
    ],
    phases:[
      {t:"Stage 1 LLC — frequency tracking (Q1 on)",d:"Stage 1 primary switch Q1 conducts. Resonant current flows sinusoidally through Lr₁ and Cr₁. Lm₁ is clamped to n₁×Vbus. Secondary diode D1 conducts — energy delivers to the intermediate bus. Switching frequency fs₁ is set by the voltage control loop targeting Vbus = n₂×Vout."},
      {t:"Stage 1 LLC — dead time and ZVS",d:"Q1 turns off. Inductive resonant current charges Q1's Coss and discharges Q2's Coss resonantly. Q2's drain node swings to zero — ZVS achieved. Dead time is sized to allow full capacitive swing. Stage 1 frequency varies with input voltage but always operates in the inductive (ZVS-capable) region."},
      {t:"Stage 2 LLC DCX — fixed resonant half-cycle",d:"Stage 2 runs open-loop at exactly fr1 = 1/(2π√(Lr₂·Cr₂)) with 50% duty cycle. Resonant current is a clean sinusoid — peak is determined only by Vbus, n₂, and tank impedance. Secondary diode D3 conducts and turns off at natural current zero — ZCS, zero reverse recovery loss. No gate signal timing adjustment required."},
      {t:"Stage 2 LLC DCX — complementary half-cycle",d:"Complementary primary switch fires at exactly 50% duty. Reverse resonant half-cycle mirrors the first. Secondary diode D4 conducts. Current returns to zero at end of interval. Both primary switches achieve ZVS; both secondary diodes achieve ZCS every cycle. Stage 2 has no control loop — its output voltage is fixed by Vbus/n₂."}
    ],
    pros:["ZVS on all primary switches in both stages","ZCS on all secondary diodes — zero reverse recovery","Stage 2 runs open-loop — no frequency modulation noise","Very low EMI due to sinusoidal currents throughout","Stage 1 regulates; Stage 2 needs no control — modular design"],
    cons:["Unidirectional only — bidirectional requires synchronous rectifiers and reverse mode","Two transformer and inductor sets — larger than single-stage","Intermediate bus capacitor adds volume and failure point","Stage 1 efficiency degrades at wide input range extremes","Two resonant tanks to design and match across temperature"],
    apps:["Ultra-high efficiency server and telecom PSUs","EV charger secondary DC-DC stage (non-bidirectional)","High-density datacenter DC-DC (48V → PoL)","Solar inverter DC-DC link stage","Industrial LED drivers requiring >98% efficiency","Medical and instrument isolated DC-DC supplies"]
  },
  {
    id:"PSFB", name:"Phase-Shifted Full Bridge",
    sub:"The battle-tested workhorse of high-power isolated DC-DC — proven in millions of server PSUs, welders, and industrial supplies.",
    tags:[{l:"ZVS leading leg",c:"g"},{l:"High power",c:"g"},{l:"Galvanic isolation",c:"b"},{l:"Mature topology",c:"b"},{l:"ZVS lost at light load",c:"a"}],
    specs:[{k:"Typical power",v:"500 W – 100 kW"},{k:"Switching freq.",v:"50 – 200 kHz"},{k:"Efficiency",v:"94 – 97%"},{k:"Control variable",v:"Phase-shift D (0 to 1)"},{k:"Switch count",v:"4 primary + rectifier"},{k:"Isolation",v:"Yes — HF transformer"}],
    analysis:
      '<div class="divider"></div>' +
      '<div class="section-label">Operating Intervals &mdash; SLUA107A</div>' +
      '<div class="op-interval-rows">' +

      '<div class="op-interval-row">' +
        '<div class="row-left">' +
          '<div class="row-img"><img src="4.PSFB/image/t0_initial_conditions.PNG" alt="Initial conditions QA QD on"></div>' +
          '<div class="row-wave"><img src="4.PSFB/image/OP_WaveForm_t0.PNG" alt="Operational waveforms at t0"></div>' +
        '</div>' +
        '<div class="row-text">' +
          '<div class="row-title">INITIAL CONDITIONS &mdash; Time: t &lt; t(0) &nbsp;&middot;&nbsp; Q<sub>A</sub> = ON, Q<sub>D</sub> = ON</div>' +
          '<div class="row-desc">' +
            '<p>The description of the Phase Shifted operation will begin with the conclusion of one power transfer cycle. This occurs when the transformer had been delivering power to the load and two of diagonal switches of the converter were conducting. The initial current flowing in the primary can be designated as I<sub>P</sub>(t(0)).</p>' +
          '</div>' +
        '</div>' +
      '</div>' +

      '<div class="op-interval-row">' +
        '<div class="row-left">' +
          '<div class="row-img"><img src="4.PSFB/image/t0-t1_rightLeg_transition.PNG" alt="Right leg transition t0 to t1"></div>' +
          '<div class="row-wave"><img src="4.PSFB/image/OP_WaveForm_t0-t1.PNG" alt="Operational waveforms t0 to t1"></div>' +
        '</div>' +
        '<div class="row-text">' +
          '<div class="row-title">RIGHT LEG RESONANT TRANSITION INTERVAL &mdash; Time: t(0) &lt; t &lt; t(1) &nbsp;&middot;&nbsp; Q<sub>A</sub> = ON, Q<sub>D</sub> = OFF, C<sub>C</sub>&darr; C<sub>D</sub>&uarr;</div>' +
          '<div class="row-desc">' +
            '<p>The primary current flowing at time t(0) is equal to I<sub>P</sub>(t(0)) and was being conducted through the diagonal set of transistors Q<sub>A</sub> in the upper left hand corner of the bridge and transistor Q<sub>D</sub> in the lower right. Instantly, at time t(0) switch Q<sub>D</sub> is turned off by the control circuitry which begins the resonant transition of the right hand leg of the converter.</p>' +
            '<p>The primary current flowing is maintained nearly constant at I<sub>P</sub>(t(0)) by the resonant inductance of the primary circuit, often referred to as the transformers leakage inductance. Since an external series inductance can be added to alter the effective leakage inductance value, this presentation will refer to the lumped sum of these inductors as the resonant inductance, L<sub>R</sub>. In a practical application it may be difficult to accurately control the transformers leakage inductance within an acceptable ZVS range, necessitating an external &ldquo;shim&rdquo; inductor to control the accuracy. It&rsquo;s also possible that the transformer leakage inductance can be too low to provide the desired transition times for the application so an external inductor can be introduced to modify the resonant inductance.</p>' +
            '<p>With switch Q<sub>D</sub> turned off, the primary current continues to flow using the switch output capacitance, C<sub>D</sub> to provide the path. This charges the switch capacitance of Q<sub>D</sub> from essentially zero volts to the upper voltage rail, V<sub>IN</sub>+. Simultaneously, the transformer capacitance (C<sub>xfmr</sub>) and the output capacitance of switch Q<sub>C</sub> is discharged as its source voltage rises from the lower to the upper rail voltage. This resonant transition positions switch Q<sub>C</sub> with no drain to source voltage prior to turn-on and facilitates lossless, zero voltage switching.</p>' +
            '<p>The primary current causing this right leg transition can be approximated by the full load primary current of I<sub>P</sub>(t(0)). The small change due to the barely resonant circuit contribution is assumed to be negligible in comparison to the magnitude of the full load current.</p>' +
            '<p>During this right leg transition the voltage across the transformers primary has decreased from V<sub>IN</sub> to zero. At some point in the transition the primary voltage drops below the reflected secondary voltage, V<sub>O</sub> &times; N. When this occurs the primary is no longer supplying full power to the secondary and the output inductor voltage changes polarity. Simultaneously, energy stored in the output choke begins supplementing the decaying primary power until the primary contribution finally reaches zero.</p>' +
            '<p>Once the right leg transition has been completed there is no voltage across the transformer primary. Likewise, there is no voltage across the transformers secondary winding and no power transferred, assuming ideal conditions. Note that the resonant transition not only defines the rate of change in primary and secondary voltages dV/dt, but also the rate of change in current in the output filter network, dI/dt.</p>' +
          '</div>' +
        '</div>' +
      '</div>' +

      '<div class="op-interval-row">' +
        '<div class="row-left">' +
          '<div class="row-img"><img src="4.PSFB/image/t1-t2_clampedfreewheeling_interval.PNG" alt="Clamped freewheeling t1 to t2"></div>' +
          '<div class="row-wave"><img src="4.PSFB/image/OP_WaveForm_t1-t2.PNG" alt="Operational waveforms t1 to t2"></div>' +
        '</div>' +
        '<div class="row-text">' +
          '<div class="row-title">CLAMPED FREEWHEELING INTERVAL &mdash; Time: t(1) &lt; t &lt; t(2) &nbsp;&middot;&nbsp; Q<sub>A</sub> = ON, Q<sub>C</sub> = ON, D<sub>C</sub> = ON</div>' +
          '<div class="row-desc">' +
            '<p>Once the right leg transition is complete the primary current free wheels through transistor Q<sub>A</sub> and the body diode of switch Q<sub>C</sub>. The current would remain constant until the next transition occurs assuming that the components were ideal. Switch Q<sub>C</sub> can be turned on at this time which shunts the body diode with the FET R<sub>ds(on)</sub> switch impedance thus lowering conduction losses. Although current is flowing opposite to the normal convention (source to drain) the channel of Q<sub>C</sub> will conduct and divide the current between the switch and body diode.</p>' +
          '</div>' +
        '</div>' +
      '</div>' +

      '<div class="op-interval-row">' +
        '<div class="row-left">' +
          '<div class="row-img"><img src="4.PSFB/image/t2-t3_leftLeg_transition.PNG" alt="Left leg transition t2 to t3"></div>' +
          '<div class="row-wave"><img src="4.PSFB/image/OP_WaveForm_t2-t3.PNG" alt="Operational waveforms t2 to t3"></div>' +
        '</div>' +
        '<div class="row-text">' +
          '<div class="row-title">LEFT LEG TRANSITION INTERVAL &mdash; Time: t(2) &lt; t &lt; t(3) &nbsp;&middot;&nbsp; Q<sub>A</sub> = OFF, Q<sub>C</sub> = ON, D<sub>C</sub> = ON, C<sub>B</sub>&darr; C<sub>A</sub>&uarr;</div>' +
          '<div class="row-desc">' +
            '<p>At time t(2) a residual current was flowing in the primary of the transformer which is slightly less than I<sub>P</sub>(t(0)) due to losses. Switch Q<sub>C</sub> has been previously turned ON and switch Q<sub>A</sub> will now be turned OFF. The primary current will continue to flow but the path has changed to the output capacitance (C<sub>A</sub>) of switch Q<sub>A</sub> instead of its channel. The direction of current flowing causes the drain to source voltage of switch Q<sub>A</sub> to increase and lowers its source from the upper to lower rail voltage. Just the opposite conditions have occurred to switch Q<sub>B</sub> which previously had the full input across its terminals. The resonant transition now aligns switch Q<sub>B</sub> with zero voltage across it, enabling lossless switching to occur.</p>' +
            '<p>Primary current continues to flow and is clamped by the body diode of switch Q<sub>B</sub>, which is still OFF. This clamping into a short circuit is a necessary condition for fixed frequency, zero voltage switching. Once switch Q<sub>B</sub> is turned ON, the transformer primary is placed across the input supply rails since switch Q<sub>C</sub> is already ON and will begin to transfer power. Although zero voltage switching has already been established, turning ON switch Q<sub>B</sub> the instant it reaches zero voltage will cause variable frequency operation.</p>' +
            '<p>Note that this left leg transition will require more time to complete than the right leg transition. Conduction losses in the primary switches, transformer winding and interconnections result in a net DC voltage drop due to the flowing primary current. Energy stored in the series resonant inductor and magnetizing inductance is no longer ideally clamped to zero voltage. This loss, in addition to the losses incurred during the previous transition, reduce the primary current below its initial I<sub>P</sub>(t(0)) value, thus causing a longer left leg transition time than the right leg.</p>' +
            '<p>Unlike conventional power conversion, one transistor in the diagonal pair of the phase shifted full bridge converter is ON just before power is transferred which simplifies the gate drive. An additional benefit is realized by designating these commutating switches as the high side switches of the converter, usually far more difficult to drive than their lower side counterparts.</p>' +
          '</div>' +
        '</div>' +
      '</div>' +

      '<div class="op-interval-row">' +
        '<div class="row-left">' +
          '<div class="row-img"><img src="4.PSFB/image/t3-t4_powerTransfer.PNG" alt="Power transfer t3 to t4"></div>' +
          '<div class="row-wave"><img src="4.PSFB/image/OP_WaveForm_t3-t4.PNG" alt="Operational waveforms t3 to t4"></div>' +
        '</div>' +
        '<div class="row-text">' +
          '<div class="row-title">POWER TRANSFER INTERVAL &mdash; Time: t(3) &lt; t &lt; t(4) &nbsp;&middot;&nbsp; Q<sub>B</sub> = ON, Q<sub>C</sub> = ON</div>' +
          '<div class="row-desc">' +
            '<p>This interval of the phase shifted cycle is basically identical to that of conventional square wave power conversion. Two diagonal switches are ON which applies the full input voltage across the transformer primary. Current rises at a rate determined by V<sub>IN</sub> and the series primary inductance, however starts at a negative value as opposed to zero. The current will increase to a DC level equal to the output current divided by the turns ratio, I<sub>O</sub>/N. The two time variant contributors to primary current are the magnetizing current (I<sub>MAG</sub>) and the output inductor magnetizing contribution reflected to the primary, L<sub>O</sub> &times; N&sup2;. The exact switch ON time is a function of V<sub>IN</sub>, V<sub>O</sub> and N the transformer turns ratio, just as with conventional converters.</p>' +
          '</div>' +
        '</div>' +
      '</div>' +

      '</div>' +
      '<div class="divider"></div>',
    pros:["Very mature — decades of industrial validation","ZVS on the leading leg at all load levels","Handles high power without series/parallel tricks","Current-mode control is simple and reliable","Standard wound magnetics — well-understood design"],
    cons:["ZVS on lagging leg requires minimum load current","Duty cycle loss forces larger transformer turns ratio","Large output filter inductor needed","Secondary rectifier has hard commutation spikes","Not naturally bidirectional (needs extra switches)"],
    apps:["Telecom rectifiers (48V, −48V outputs)","Industrial welding and plasma cutting supplies","Server PSUs (older generation before LLC)","Medical imaging HV power supplies","Railway auxiliary converters","Military and defence DC-DC modules"]
  },
  {
    id:"DAB", name:"Dual Active Bridge",
    sub:"The dominant bidirectional isolated DC-DC topology in modern power electronics — used everywhere from EV chargers to solid-state transformers.",
    tags:[{l:"Bidirectional",c:"g"},{l:"ZVS / ZCS",c:"g"},{l:"Galvanic isolation",c:"b"},{l:"Wide voltage range",c:"b"},{l:"8 active switches",c:"a"}],
    specs:[{k:"Typical power",v:"1 kW – 1 MW"},{k:"Switching freq.",v:"10 kHz – 500 kHz"},{k:"Efficiency",v:"96 – 99%"},{k:"Control variable",v:"Phase-shift angle φ"},{k:"Switch count",v:"8 MOSFETs / IGBTs"},{k:"Isolation",v:"Yes — HF transformer"}],
    imgs:[
      {src:"1.DAB/image/DAB.PNG", cap:"DAB circuit topology — primary H-bridge (Q1–Q4) and secondary H-bridge (Q5–Q8) linked by series inductor Lr and HF transformer TX1 (turns ratio 1:N)"},
      {src:"1.DAB/image/Determining+Inductor_Currents.PNG", cap:"Inductor current analysis — i_L(t), v_L(t), v_p(t) and v_s(t) waveforms with phase-shift d·T₁ and peak-current formulas I₁, I₂"}
    ],
    analysis: '<div class="divider"></div>' +
      '<div class="section-label">DAB Converter Model</div>' +
      '<div class="explanation"><p>The topology of the DAB converter can be divided into five parts: two H-bridges consisting of eight switching tubes on the primary and secondary sides, a high-frequency isolation transformer with a ratio of <strong>1:N</strong>, an input voltage V<sub>1</sub>, a load resistor R, and an output filtering capacitor C.</p></div>' +
      '<div class="section-label">Single-Phase-Shift Modulation</div>' +
      '<div class="explanation"><p>In the single-phase shift (SPS) modulation mode, the diagonal switching tubes on both sides of the full bridge conduct and turn off at the same time, and the on and off time each accounts for 50% of the switching period T. The output waveforms of both sides of the full bridge are square waves. For the converter with an operating frequency of f and switching half-cycle of T<sub>s</sub> = 0.5/f = 0.5T, the shift ratio D (0 &lt; D &lt; 1) is defined as the phase shift of the two bridge waveforms. The switching timing is defined as:</p></div>' +
      '<div class="eq-block">' +
      't₀ = 0,   t₂ = DTₛ,   t₃ = Tₛ,   t₅ = Tₛ(1+D),   t₆ = T' +
      '</div>' +
      '<div class="section-label">Inductor Current — Four Intervals</div>' +
      '<div class="wave-table-wrap"><table class="wave-table"><thead><tr><th>Eq.</th><th>Interval</th><th>Inductor current equation</th></tr></thead><tbody>' +
      '<tr><td>(1)</td><td>t &isin; [t<sub>0</sub>, t<sub>2</sub>]</td><td>i<sub>L</sub>(t) = i<sub>L</sub>(t<sub>0</sub>) + <strong>(V<sub>1</sub> + V<sub>2</sub>/N) / L</strong> &sdot; (t &minus; t<sub>0</sub>)</td></tr>' +
      '<tr><td>(2)</td><td>t &isin; [t<sub>2</sub>, t<sub>3</sub>]</td><td>i<sub>L</sub>(t) = i<sub>L</sub>(t<sub>2</sub>) + <strong>(V<sub>1</sub> &minus; V<sub>2</sub>/N) / L</strong> &sdot; (t &minus; t<sub>2</sub>)</td></tr>' +
      '<tr><td>(3)</td><td>t &isin; [t<sub>3</sub>, t<sub>5</sub>]</td><td>i<sub>L</sub>(t) = i<sub>L</sub>(t<sub>3</sub>) &minus; <strong>(V<sub>1</sub> &minus; V<sub>2</sub>/N) / L</strong> &sdot; (t &minus; t<sub>3</sub>)</td></tr>' +
      '<tr><td>(4)</td><td>t &isin; [t<sub>5</sub>, t<sub>6</sub>]</td><td>i<sub>L</sub>(t) = i<sub>L</sub>(t<sub>5</sub>) + <strong>(&minus;V<sub>1</sub> + V<sub>2</sub>/N) / L</strong> &sdot; (t &minus; t<sub>5</sub>)</td></tr>' +
      '</tbody></table></div>' +
      '<div class="explanation"><p>During steady-state operation, the inductor current satisfies the half-wave symmetry conditions:</p></div>' +
      '<div class="eq-block">' +
      '(5)   iᴸ(t₀) = −iᴸ(t₃)\n' +
      '(6)   iᴸ(t₂) = −iᴸ(t₅)' +
      '</div>' +
      '<div class="section-label">Steady-State Peak Currents</div>' +
      '<div class="explanation"><p>Applying the symmetry conditions (5) and (6) to equations (1)–(4) and solving simultaneously yields the steady-state initial values of the inductor current:</p></div>' +
      '<div class="eq-block">' +
      '<span class="eq-green">(7)   i(t₀) = (1/4fL) · [ V₂·(1−2D)/N  −  V₁ ]</span>\n' +
      '<span class="eq-amber">(8)   i(t₂) = (1/4fL) · [ V₂/N  −  V₁·(1−2D) ]</span>' +
      '</div>' +
      '<div class="section-label">Output Capacitor Equations</div>' +
      '<div class="explanation"><p>The capacitor current varies periodically across the four switching intervals:</p></div>' +
      '<div class="wave-table-wrap"><table class="wave-table"><thead><tr><th>Eq.</th><th>Interval</th><th>Capacitor current equation</th></tr></thead><tbody>' +
      '<tr><td>(9)</td><td>t &isin; [t<sub>0</sub>, t<sub>2</sub>]</td><td>C &sdot; dV<sub>2</sub>/dt = &minus;i<sub>L</sub>(t)/N &minus; V<sub>2</sub>/R</td></tr>' +
      '<tr><td>(10)</td><td>t &isin; [t<sub>2</sub>, t<sub>3</sub>]</td><td>C &sdot; dV<sub>2</sub>/dt = &nbsp;i<sub>L</sub>(t)/N &minus; V<sub>2</sub>/R</td></tr>' +
      '<tr><td>(11)</td><td>t &isin; [t<sub>3</sub>, t<sub>5</sub>]</td><td>C &sdot; dV<sub>2</sub>/dt = &nbsp;i<sub>L</sub>(t)/N &minus; V<sub>2</sub>/R</td></tr>' +
      '<tr><td>(12)</td><td>t &isin; [t<sub>5</sub>, t<sub>6</sub>]</td><td>C &sdot; dV<sub>2</sub>/dt = &minus;i<sub>L</sub>(t)/N &minus; V<sub>2</sub>/R</td></tr>' +
      '</tbody></table></div>' +
      '<div class="section-label">Averaged Output Model</div>' +
      '<div class="explanation"><p>Substituting equations (1)–(8) into (9)–(12) gives the capacitor dynamics across each subinterval. Averaging these two equations over the period range t &isin; [0, T<sub>s</sub>] yields the average model of the DAB converter:</p></div>' +
      '<div class="eq-block">' +
      '(15)   dV₂/dt = −V₂/(RC)  +  [V₁/(2NfLC)] · D·(1−D)' +
      '</div>' +
      '<div class="explanation"><p>At steady state (dV<sub>2</sub>/dt = 0), the relationship between the output voltage and the shift ratio is:</p></div>' +
      '<div class="eq-block">' +
      '<span class="eq-accent">(16)   V₂ = [V₁·R / (2NfL)] · D·(1−D)</span>' +
      '</div>' +
      '<div class="analysis-insight"><p>The output voltage V<sub>2</sub> shows a quadratic function relationship with the phase-shift ratio D. V<sub>2</sub> is only related to the input voltage V<sub>1</sub>, the load R, the switching frequency f, the inductance L, and the phase-shift ratio D — these parameters are all independent of the transformer ratio N.</p></div>' +
      '<div class="divider"></div>',
    how:[],
    phases:[],
    pros:["True bidirectional power flow","Natural ZVS for the leading H-bridge","Simple control: one parameter (φ)","Excellent for battery storage and V2G","Very high power density achievable"],
    cons:["Heavy reactive current at light load","Optimally efficient only at one voltage ratio","ZVS lost on lagging leg at low power","8 gate drivers required","Transformer leakage must be precisely controlled"],
    apps:["EV on-board chargers","V2G bidirectional systems","Battery energy storage (BESS)","Solid-state transformers","DC microgrids","Aerospace isolated DC-DC"]
  },
  {
    id:"DAB+LLC", name:"DAB + LLC Hybrid",
    sub:"Two-stage cascade combining DAB regulation flexibility with LLC resonant efficiency — achieving what neither topology accomplishes alone.",
    tags:[{l:"Bidirectional (DAB stage)",c:"g"},{l:"Peak efficiency (LLC stage)",c:"g"},{l:"Wide input range",c:"g"},{l:"Two transformers",c:"a"},{l:"Two control loops",c:"a"}],
    specs:[{k:"Stage 1",v:"DAB — regulation"},{k:"Stage 2",v:"LLC in DCX mode"},{k:"LLC gain",v:"Fixed = n (turns ratio)"},{k:"DAB control",v:"Phase shift φ"},{k:"Peak efficiency",v:"97 – 99%"},{k:"Isolation",v:"Both stages isolated"}],
    how:[
      "The fundamental motivation: the LLC achieves extraordinary efficiency (>99% at its resonant point) but only at one fixed voltage ratio and in one direction. The DAB handles wide voltage ranges and bidirectionality but carries higher reactive currents. Cascading them extracts the best of each while hiding each other's weaknesses.",
      "<strong>Stage 1 — DAB as voltage regulator:</strong> The DAB accepts a wide-range input (e.g. 200–800 V battery) and converts it to a tightly regulated intermediate DC bus voltage. By adjusting phase shift φ continuously, the DAB maintains the intermediate bus at exactly the value the LLC needs to operate at series resonance. The DAB handles all regulation and bidirectionality. Its efficiency is moderate (~95%) but it only sees a fraction of total losses because its main function is voltage transformation, not power processing efficiency.",
      "<strong>Stage 2 — LLC as DC transformer (DCX):</strong> With the intermediate bus held constant, the LLC stage is locked at its series resonant frequency fr1. No frequency modulation. No regulation. The LLC is a fixed-ratio DC transformer: gain = turns ratio n, ZVS on primary MOSFETs is perfect, ZCS on secondary diodes is guaranteed, reactive circulating current is minimized. Efficiency at this single operating point routinely exceeds 99%.",

    '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--text3)"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>' +
    '</div>' +
    '<div class="placeholder-text">Schematic image for ' + t.name + '<br>will appear here</div>' +
    '<label class="add-img-btn" for="img-' + idx + '">+ Add schematic image</label>' +
    '<input class="img-input" type="file" id="img-' + idx + '" accept="image/*" onchange="loadImg(this, ' + idx + ')">';
}

function loadImg(input, idx) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const block = document.getElementById('sch-'+idx);
    block.innerHTML = `<img src="${e.target.result}" class="loaded" alt="Schematic for topology ${idx}">
      <label class="add-img-btn" for="img2-${idx}" style="margin-top:12px">Replace image</label>
      <input class="img-input" type="file" id="img2-${idx}" accept="image/*" onchange="loadImg(this, ${idx})">`;
  };
  reader.readAsDataURL(file);
}
  showAI();
</script>
</body>
</html>
