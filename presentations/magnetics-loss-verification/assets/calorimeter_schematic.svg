<svg xmlns="http://www.w3.org/2000/svg" width="880" height="920" viewBox="0 0 880 920" font-family="Carlito, Calibri, Arial, sans-serif">
<defs>
  <pattern id="vac" width="12" height="12" patternUnits="userSpaceOnUse">
    <rect width="12" height="12" fill="#F2F5F7"/><circle cx="6" cy="6" r="1.6" fill="#9AA8B2"/>
  </pattern>
  <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="10" height="10" fill="#D7DEE3"/><line x1="0" y1="0" x2="0" y2="10" stroke="#B3BEC6" stroke-width="3"/>
  </pattern>
  <linearGradient id="liq" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#D6F0F2"/><stop offset="1" stop-color="#A3D5DA"/>
  </linearGradient>
  <clipPath id="inner"><path d="M210,363 L210,820 Q210,870 260,870 L600,870 Q650,870 650,820 L650,363 Z"/></clipPath>
  <clipPath id="heater"><rect x="500" y="600" width="60" height="130" rx="14"/></clipPath>
  <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#C46A2B"/>
  </marker>
</defs>

<!-- instrument tags (cables end at their lower edge) -->
<rect x="200" y="40" width="150" height="40" rx="8" fill="#F6E6DA" stroke="#C46A2B" stroke-width="2"/><text x="275.0" y="67" text-anchor="middle" font-size="22" font-weight="bold" fill="#7E3F14">converter</text>
<rect x="360" y="40" width="100" height="40" rx="8" fill="#DCEFF1" stroke="#0F7C86" stroke-width="2"/><text x="410.0" y="67" text-anchor="middle" font-size="22" font-weight="bold" fill="#0B5D64">Arduino</text>
<rect x="470" y="40" width="120" height="40" rx="8" fill="#F6E6DA" stroke="#C46A2B" stroke-width="2"/><text x="530.0" y="67" text-anchor="middle" font-size="22" font-weight="bold" fill="#7E3F14">LV supply</text>
<rect x="600" y="40" width="220" height="40" rx="8" fill="#E7ECEF" stroke="#5B6B77" stroke-width="2"/><text x="710.0" y="67" text-anchor="middle" font-size="22" font-weight="bold" fill="#2A3640">DAQ970A</text>

<!-- Dewar flask: vacuum jacket between outer and inner wall -->
<path d="M180,363 L180,830 Q180,900 250,900 L610,900 Q680,900 680,830 L680,363 Z" fill="url(#vac)" stroke="#2A3640" stroke-width="4"/>
<path d="M210,363 L210,820 Q210,870 260,870 L600,870 Q650,870 650,820 L650,363 Z" fill="#FFFFFF" stroke="#2A3640" stroke-width="3"/>
<rect x="210" y="430" width="440" height="450" fill="url(#liq)" clip-path="url(#inner)"/>
<path d="M212,430 q9,-6 18,0 t18,0 q9,-6 18,0 t18,0 q9,-6 18,0 t18,0 q9,-6 18,0 t18,0 q9,-6 18,0 t18,0 q9,-6 18,0 t18,0 q9,-6 18,0 t18,0 q9,-6 18,0 t18,0 q9,-6 18,0 t18,0 q9,-6 18,0 t18,0 q9,-6 18,0 t18,0 q9,-6 18,0 t18,0" fill="none" stroke="#5FAAB2" stroke-width="2"/>
